services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      PMA_USER: root
      PMA_PASSWORD: admin
    ports:
      - "8888:80"  # phpMyAdmin на порту 8888
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - selenoid

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - selenoid

  prestashop_backend:
    image: prestashop/prestashop:8.1.5
    container_name: prestashop_backend
    restart: unless-stopped
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      DB_PREFIX: ps_
      PS_INSTALL_AUTO: "1"
      PS_LANGUAGE: "en"
      PS_COUNTRY: "US"
      PS_DEV_MODE: "1"
      PS_DOMAIN: "localhost:8083"  # Изменено на 8083
      ADMIN_MAIL: "admin@example.com"
      ADMIN_PASSWD: "Admin123!"
      PS_FOLDER_ADMIN: "administration"
      PS_FOLDER_INSTALL: "install"
    volumes:
      - ps_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - selenoid
    dns:
      - 8.8.8.8
      - 1.1.1.1

  prestashop:
    image: nginx:alpine
    container_name: prestashop
    restart: unless-stopped
    ports:
      - "8083:80"  # PrestaShop на порту 8083
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - prestashop_backend
    networks:
      - selenoid

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tests
    volumes:
      - .:/root/prestashop_tests
      - ./allure-results:/app/allure-results
    depends_on:
      - prestashop
      - selenoid
    networks:
      - selenoid
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PRESTASHOP_URL=http://prestashop:80/
      - SELENOID_URL=http://selenoid:4444/wd/hub
      - PYTHONDONTWRITEBYTECODE=1
    working_dir: /root/prestashop_tests

  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    shm_size: 2gb
    environment:
      - DOCKER_API_VERSION=1.45
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./browsers.json:/etc/selenoid/browsers.json:ro
    networks:
      - selenoid
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      -conf /etc/selenoid/browsers.json
      -container-network selenoid
      -limit 10
      -session-attempt-timeout 2m
      -timeout 5m
    ports:
      - "4444:4444"  # Selenoid на порту 4444

  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    container_name: selenoid-ui
    networks:
      - selenoid
    ports:
      - "8090:8080"  # Selenoid UI на порту 8090 (внутри контейнера 8080)
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid

  jenkins:
    image: jenkins-python-qa
    container_name: jenkins-python
    restart: unless-stopped
    ports:
      - "8080:8080"  # Jenkins на порту 8080
      - "50000:50000"  # Jenkins агенты
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - selenoid
    depends_on:
      - selenoid
      - prestashop
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

networks:
  selenoid:
    driver: bridge
    name: selenoid

volumes:
  db_data:
    driver: local
  ps_data:
    driver: local
  jenkins_home:
    driver: local
